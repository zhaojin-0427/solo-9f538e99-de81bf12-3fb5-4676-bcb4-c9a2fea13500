services:
  stability-register:
    build: .
    image: stability-register:latest
    container_name: stability-register
    ports:
      - "8000:8000"
    environment:
      DATA_DIR: /data
      SECRET_KEY: change-me-in-production
      PORT: "8000"
    volumes:
      - stability_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/', timeout=4).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  stability_data:
